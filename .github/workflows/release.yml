# A release of every merge to master. The checks run on the merge first
# (CI: the tests on Linux, macOS and Windows); then the version is chosen,
# the app is built for each platform and the daemon for each CPU, signed
# with the release key and published on the version's GitHub release:
#
# - the app's bundles (tauri-action), each signed for the app's updates
#   (src-tauri/tauri.updater.conf.json turns that on here alone: a build
#   without the key, a developer's or the end-to-end runs', makes none),
#   and the updater's latest.json, which the publish job writes from their
#   signatures (scripts/updater-manifest.mjs) once every platform's are on
#   the release;
# - rovik-agentd-<version>-<cpu> for x86_64 and aarch64, static builds
#   for any Linux (scripts/build-agentd.sh), gzipped (.gz, a tenth of
#   their size), each with the build's .sig, and their SHA256SUMS with its
#   .sig: what the app downloads for a deploy and its install check reads
#   (B02).
#
# rovik-ide.dev needs nothing more: its download buttons ask GitHub for the
# latest release in the visitor's browser.
#
# The version is the sources' own while no release has it: the first
# release, or one a pull request set with scripts/set-version.sh. Otherwise
# its last number goes up by one, 1.2.3 to 1.2.4 (1.2.3-4 to 1.2.3-5 for a
# pre-release), committed to master as "Release 1.2.4 [skip ci]", a commit
# that starts no run of its own. Run by hand from the Actions tab (Run
# workflow), a version typed in is taken as it is, on the run's branch; left
# empty, it's chosen as for a merge.
#
# Nothing is published until every build is on the release: it's a draft
# until then, and its tag is made when it's published. A run that fails
# leaves only its draft, which the next run replaces: the next merge, Re-run
# failed jobs, or Run workflow publishes the version it couldn't. A merge
# that master has moved past when its run starts is left to the newer
# merge's run, which holds it.
#
# It needs, in the repository's secrets, the key `npx tauri signer
# generate` made: TAURI_SIGNING_PRIVATE_KEY, and its password in
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The public half goes in
# src-tauri/release-key.pub (and the updater's pubkey). Once master is
# protected, RELEASE_TOKEN, a token of someone who may push to it past its
# rules, pushes the version's commit. A version such as 1.2.3-4 is
# published as a pre-release, which GitHub's latest release, and an updater
# that reads it, skips.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, as 1.2.3 (a Windows installer takes only numbers: 1.2.3-4 for a pre-release). Empty: the next one, as for a merge'
        required: false

permissions:
  contents: write

# One release at a time, each to its end. Of the merges waiting, the latest
# one runs: it holds those before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Choose the version, and draft the release
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.choose.outputs.version }}
      tag: ${{ steps.choose.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      # Empty when no release is due: the jobs after this one skip.
      release: ${{ steps.draft.outputs.id }}
    steps:
      - name: Check where it runs, and the release key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Run the workflow on a branch, not on $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't in the repository's secrets (README, Releases)."
            exit 1
          fi
      # The tags too: they say which versions are released.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Choose the version
        id: choose
        env:
          # Taken as the text it is: never written into the script.
          TYPED: ${{ inputs.version }}
        run: |
          head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME has moved on to ${head:0:7}: a newer run releases this commit with it (or Run workflow does)."
            exit 0
          fi
          released() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          current=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
          if [ -n "$TYPED" ]; then
            version=$TYPED
          elif ! released "$current"; then
            version=$current
          elif [ "$(git rev-parse "v$current^{commit}")" = "$GITHUB_SHA" ]; then
            echo "::notice::Nothing new since v$current."
            exit 0
          else
            case "$current" in
              *-*) version="${current%-*}-$((${current##*-} + 1))" ;;
              *) version="${current%.*}.$((${current##*.} + 1))" ;;
            esac
          fi
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::'$version' isn't a version a Windows installer takes: 1.2.3, or 1.2.3-4 for a pre-release."
            exit 1
          fi
          if released "$version"; then
            echo "::error::v$version is released already."
            exit 1
          fi
          echo "Releasing $version (the sources have $current)."
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "bump=$([ "$version" = "$current" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.choose.outputs.bump == 'true'
      - uses: actions/setup-node@v4
        if: steps.choose.outputs.bump == 'true'
        with:
          node-version: 22
      - name: Set the version, and commit it
        id: commit
        if: steps.choose.outputs.version != ''
        env:
          VERSION: ${{ steps.choose.outputs.version }}
          BUMP: ${{ steps.choose.outputs.bump }}
          # Whether the checkout, and so the push, took RELEASE_TOKEN.
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$BUMP" = true ]; then
            scripts/set-version.sh "$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Release $VERSION [skip ci]"
            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
              if [ "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" != "$GITHUB_SHA" ]; then
                echo "::notice::$GITHUB_REF_NAME moved on meanwhile: a newer run releases this commit with it."
                exit 0
              fi
              if [ "$HAS_RELEASE_TOKEN" = true ]; then
                echo "::error::$GITHUB_REF_NAME's rules refused the version's commit from RELEASE_TOKEN: the token's owner must be on the ruleset's bypass list (Repository admin, Always allow), and the token must write the repository's contents (README, Protecting master)."
              else
                echo "::error::$GITHUB_REF_NAME's rules refused the version's commit: RELEASE_TOKEN, a token of someone who may push past them, isn't in the repository's secrets (README, Protecting master)."
              fi
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Draft the release
        id: draft
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.choose.outputs.version }}
          TAG: ${{ steps.choose.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # A draft of this version that a failed run left goes first.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft and .tag_name == env.TAG) | .id' |
            while read -r stale; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$stale"
            done
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          # GitHub's notes, a mention in a pull request's title kept as text
          # (scripts/release-notes.mjs): a title's "@context" isn't a user,
          # to be listed among the release's contributors.
          notes=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body |
            node scripts/release-notes.mjs)
          # The tag is made on that commit when the release is published.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$SHA" -f name="Rovik $VERSION" \
            -f body="$notes" -F draft=true -F prerelease=$prerelease \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  daemon:
    name: Daemon (${{ matrix.cpu }})
    needs: version
    if: needs.version.outputs.release != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cpu }}-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zig and cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Build
        run: scripts/build-agentd.sh ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.cpu }}
          path: src-tauri/target/agentd/rovik-agentd-*
          if-no-files-found: error

  app:
    name: App (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04
            args: ''
          - name: macOS, Apple silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS, Intel
            runner: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Install the system's packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            libsoup-3.0-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The draft the version job made, so that the platforms don't each
          # make one; the tag names the updater's download links.
          releaseId: ${{ needs.version.outputs.release }}
          tagName: ${{ needs.version.outputs.tag }}
          # The updater's bundles too, each signed (createUpdaterArtifacts).
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          # The publish job writes latest.json: each job adding its platform
          # to the file on the release, as tauri-action does, loses one when
          # two jobs end at once.
          includeUpdaterJson: false

  publish:
    name: Sign the daemon, and publish
    needs: [version, daemon, app]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: agentd
          merge-multiple: true
      - name: Sign the builds and their SHA256SUMS, and gzip the builds
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd agentd
          chmod 755 rovik-agentd-*
          sha256sum rovik-agentd-* > SHA256SUMS
          # Each signature is the build's own, as the server checks the
          # build it installs; the app checks it once it has unpacked.
          for file in rovik-agentd-* SHA256SUMS; do
            npx tauri signer sign "$file"
          done
          for build in rovik-agentd-*; do
            case "$build" in *.sig) continue ;; esac
            gzip -9 "$build"
          done
          ls -l
      - name: Attach them
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" agentd/*.gz agentd/*.sig agentd/SHA256SUMS --clobber
      # What the app's updates read (src-tauri/src/updates.rs): each kind of
      # app's bundle on the release, with its signature. Every platform's
      # are there by now; one missing stops the release, whose apps there
      # would be told it has nothing for them.
      - name: Write the updater's latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p updater/sigs
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE/assets" --paginate \
            --jq '.[] | "\(.id) \(.name)"' > updater/assets
          cut -d' ' -f2- updater/assets > updater/assets.txt
          # The signatures by their id: a draft has no tag to find it by yet.
          { grep '\.sig$' updater/assets || true; } | while read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H 'Accept: application/octet-stream' > "updater/sigs/$name"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE" --jq .body > updater/notes.md
          node scripts/updater-manifest.mjs --version "$VERSION" --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" --assets updater/assets.txt --sigs updater/sigs \
            --notes updater/notes.md \
            --expect linux-x86_64,windows-x86_64,darwin-aarch64,darwin-x86_64 > updater/latest.json
          gh release upload "$TAG" updater/latest.json --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Published, it makes its tag on the commit it was built from.
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE" -F draft=false --jq .html_url
