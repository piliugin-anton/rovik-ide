# The checks a pull request must pass (docs/design/autopilot-plan.md, G01):
# the Rust workspace's tests, the evaluation's dry run (the headless runner
# end to end against a scripted model, scripts/eval), the frontend's tests
# and type check, and the formatting. What a contributor runs before a
# push, run for every push to a pull request.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the pull request makes the run under way moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust tests and the evaluation's dry run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The whole history: the evaluation's tasks on this repository start
      # from its earlier commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The app's own crate builds against WebKitGTK; fuse3 gives the
      # overlay tests a mount (they skip themselves without one).
      - name: Install the system's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libxdo-dev \
            fuse3
      # Tests commit with the git command, as a developer's machine does.
      - name: Give git a name
        run: |
          git config --global user.name "Rovik CI"
          git config --global user.email "ci@rovik.invalid"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cargo test --workspace
        working-directory: src-tauri
        run: cargo test --workspace
      - name: The evaluation's dry run
        run: node scripts/eval/eval.mjs dry-run

  frontend:
    name: Frontend tests, types and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:eval
      - run: npm run typecheck
      - run: npm run format:check
