# The checks a pull request must pass (docs/design/autopilot-plan.md, G01):
# the Rust workspace's tests on each system the app ships for (Linux, macOS
# and Windows), the evaluation's dry run (the headless runner end to end
# against a scripted model, scripts/eval), the frontend's tests and type
# check, and the formatting. What a contributor runs before a push, run for
# every push to a pull request, and by the release workflow before it
# builds a merge (workflow_call). Each check is a job of its own, so they
# all run at once.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the pull request makes the run under way moot. Any other
# run (by hand, or a release's checks) is a group of its own: nothing
# cancels it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Debug info is most of what the workspace's 40-odd test binaries weigh:
  # without it they fit on the runner's disk. A failing assertion still
  # names its file and line.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  rust:
    name: Rust tests (${{ matrix.name }})
    strategy:
      # Each system's result is its own: one failing doesn't stop the others.
      fail-fast: false
      matrix:
        include:
          # `threads`: tests at once. Most of them wait (for a scripted
          # model, a timer, a child process) rather than compute: three per
          # core on Linux. Two on macOS and Windows, where starting a
          # program costs more, and three made tests that time real tools
          # (npx, PowerShell) miss their limits.
          - name: Linux
            runner: ubuntu-latest
            threads: 12
          # Where bubblewrap can't run, Landlock confines the commands: the
          # core's and the daemon's tests again, under it alone, beside the
          # others. Its build is Linux's, so it shares that cache.
          - name: Linux, Landlock
            runner: ubuntu-latest
            threads: 12
            confine: landlock
            filter: '(package(rovik-core) & kind(lib)) | package(rovik-agentd)'
          # The daemon runs on Linux servers only (D16), and its tests are
          # the server's (sudo, systemd, Linux's users and FUSE): they run on
          # Linux. On macOS it builds, for development, and so do its tests;
          # on Windows it's a stub that says so.
          - name: macOS
            runner: macos-latest
            threads: 6
            filter: 'not package(rovik-agentd)'
          - name: Windows
            runner: windows-latest
            threads: 8
            args: --exclude rovik-agentd
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Each system's own shell (PowerShell on Windows), so the tests run in
    # the environment a developer's have.
    steps:
      # Windows' git writes CRLF line ends on checkout; the tests read the
      # files as they're committed.
      - name: Keep line ends as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The app's own crate builds against WebKitGTK; fuse3 gives the
      # overlay tests a mount (they skip themselves without one, as they do
      # on macOS without macFUSE; Windows has no driver),
      # bubblewrap sandboxes every command the agent runs, as the app's
      # packages require, and passt's pasta gives a team server's commands
      # their user's private network (D20), which the core's tests make.
      - name: Install the system's packages
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          sudo bash scripts/ci-install-packages.sh "$VERSION_CODENAME" \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libxdo-dev \
            fuse3 bubblewrap passt
      # Ubuntu 24.04's AppArmor keeps programs without a profile from making
      # user namespaces, so bubblewrap can't make its sandbox, and without
      # one the agent's commands are refused: the profile the app's packages
      # and the host installer add, by the same script, then proof that it
      # works for this user with the flags the app passes.
      - name: Let bubblewrap make its sandbox
        if: runner.os == 'Linux'
        run: |
          sudo sh src-tauri/crates/rovik-core/linux/bwrap-apparmor.sh
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
            --die-with-parent --cap-drop ALL -- /bin/true
          echo "bubblewrap makes a sandbox as $(id -un)"
      # Tests commit with the git command, as a developer's machine does.
      - name: Give git a name
        run: |
          git config --global user.name "Rovik CI"
          git config --global user.email "ci@rovik.invalid"
      # The unoptimized macOS app exceeds compact unwind's 16 MiB frame-table
      # limit. Keep unwinding and debug assertions while reducing generated code.
      - name: Keep macOS unwind tables within their format limit
        if: runner.os == 'macOS'
        run: |
          echo "CARGO_PROFILE_DEV_OPT_LEVEL=1" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_OPT_LEVEL=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      # Both Linux runs build the same, and share a cache: Linux's keeps it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          save-if: ${{ !matrix.confine }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner's own toolchains this build doesn't use: room for the
      # test binaries. In the background, with nothing of the step's left
      # open, beside the build: the room is there before the build needs
      # it, and the deletion doesn't slow the steps that write the disk
      # (the packages, the cache).
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            < /dev/null > /dev/null 2>&1 &
      # Every test runs, each in a process of its own
      # (src-tauri/.config/nextest.toml), so one run shows each that fails.
      - name: cargo nextest run
        working-directory: src-tauri
        env:
          ROVIK_CONFINE_COMMANDS: ${{ matrix.confine }}
        run: >-
          cargo nextest run --workspace --profile ci
          --test-threads ${{ matrix.threads }} ${{ matrix.args }}
          -E "${{ matrix.filter || 'all()' }}"
      - name: Report macOS unwind metadata
        if: runner.os == 'macOS'
        run: xcrun size -m src-tauri/target/debug/rovik-ide
      - name: Git LFS staging and push acceptance
        if: ${{ !matrix.confine }}
        working-directory: src-tauri
        env:
          ROVIK_REAL_GIT_LFS: '1'
        run: >-
          cargo nextest run --workspace --profile ci
          --test-threads 2 ${{ matrix.args }} --run-ignored only
          -E 'package(rovik-client) & test(git::lfs::tests::)'
      - name: Parse the strict WSL acceptance script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/scripts/e2e/wsl-backend.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Package and install the Windows backend
        if: runner.os == 'Windows'
        run: |
          npm run package:windows-backend -- --profile dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'src-tauri/target/debug/bundle/nsis') {
            Remove-Item 'src-tauri/target/debug/bundle/nsis' -Recurse -Force -ErrorAction Stop
          }
          npm run tauri -- build --debug --bundles nsis --config src-tauri/tauri.windows-backend.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP 'Rovik package check'
          $bundles = @(Get-ChildItem 'src-tauri/target/debug/bundle/nsis/*-setup.exe')
          if ($bundles.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $result = Start-Process $bundles[0].FullName -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          try {
            $env:ROVIK_PACKAGED_BACKEND = Join-Path $install 'backend/rovik-desktopd.exe'
            if (!(Test-Path $env:ROVIK_PACKAGED_BACKEND)) { throw 'Installer omitted the desktop backend' }
            cargo test --manifest-path src-tauri/Cargo.toml -p rovik-client --test windows_backend
            if ($LASTEXITCODE -ne 0) { throw 'Installed backend lifecycle tests failed' }
            $env:ROVIK_TEST_INSTALLER = $bundles[0].FullName
            cargo test --manifest-path src-tauri/Cargo.toml -p rovik-client --test windows_backend installer_preserves_a_busy_backend_and_saved_edits -- --ignored
            if ($LASTEXITCODE -ne 0) { throw 'Upgrade-in-place did not preserve the busy backend' }
          } finally {
            Remove-Item Env:ROVIK_PACKAGED_BACKEND
            Remove-Item Env:ROVIK_TEST_INSTALLER -ErrorAction SilentlyContinue
            $uninstall = Join-Path $install 'uninstall.exe'
            if (Test-Path $uninstall) {
              $result = Start-Process $uninstall -ArgumentList '/S' -Wait -PassThru
              if ($result.ExitCode -ne 0) { throw "Uninstaller failed: $($result.ExitCode)" }
            }
          }
      # This contract must create real mounts. Unlike capability-sensitive unit
      # tests, a missing driver or broken mount fails this required Linux step.
      - name: Shared backend mounted isolation
        if: runner.os == 'Linux'
        working-directory: src-tauri
        env:
          ROVIK_MOUNTED_BACKEND: '1'
          ROVIK_CONFINE_COMMANDS: ${{ matrix.confine }}
        run: |
          cargo test -p rovik-core --lib mounted_child_views_drain_without_losing_their_dependency_tree -- --ignored
          cargo test -p rovik-client --test mounted_backend -- --ignored
          cargo test -p rovik-ide --test shared_backend -- --ignored
      # Doctests aren't nextest's. They run no commands: not again under
      # Landlock.
      - name: cargo test --doc
        if: ${{ !matrix.confine && !cancelled() }}
        working-directory: src-tauri
        run: cargo test --workspace --doc ${{ matrix.args }}

  eval:
    name: Evaluation dry run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history: the evaluation's tasks on this repository start
      # from its earlier commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The headless runner's commands, as the app's: in bubblewrap's
      # sandbox (with the profile Ubuntu 24.04's AppArmor asks for, see
      # above), in the chat's overlay (fuse3).
      - name: Install the system's packages
        run: |
          . /etc/os-release
          sudo bash scripts/ci-install-packages.sh "$VERSION_CODENAME" \
            build-essential pkg-config libssl-dev \
            fuse3 bubblewrap passt
      - name: Let bubblewrap make its sandbox
        run: |
          sudo sh src-tauri/crates/rovik-core/linux/bwrap-apparmor.sh
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
            --die-with-parent --cap-drop ALL -- /bin/true
      - name: Give git a name
        run: |
          git config --global user.name "Rovik CI"
          git config --global user.email "ci@rovik.invalid"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Historical evaluation tasks retain their original lockfiles. npm 11's
      # stricter validation rejects those fixtures before their tests can run.
      - name: Use the evaluation fixtures' package manager
        run: npm install --global npm@10.9.9
      - name: The evaluation's dry run
        run: node scripts/eval/eval.mjs dry-run

  frontend:
    name: Frontend tests, types and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:eval
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run format:check
