# The checks a pull request must pass (docs/design/autopilot-plan.md, G01):
# the Rust workspace's tests on each system the app ships for (Linux, macOS
# and Windows), the evaluation's dry run (the headless runner end to end
# against a scripted model, scripts/eval), the frontend's tests and type
# check, and the formatting. What a contributor runs before a push, run for
# every push to a pull request, and by the release workflow before it
# builds a merge (workflow_call).
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the pull request makes the run under way moot. Any other
# run (by hand, or a release's checks) is a group of its own: nothing
# cancels it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Debug info is most of what the workspace's 40-odd test binaries weigh:
  # without it they fit on the runner's disk. A failing assertion still
  # names its file and line.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  rust:
    name: Rust tests (${{ matrix.name }})
    strategy:
      # Each system's result is its own: one failing doesn't stop the others.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            args: ''
          # The daemon runs on Linux servers only (D16), and its tests are
          # the server's (sudo, systemd, Linux's users and FUSE): they run on
          # Linux. On macOS it builds, for development, and so do its tests;
          # on Windows it's a stub that says so.
          - name: macOS
            runner: macos-latest
            args: --exclude rovik-agentd
          - name: Windows
            runner: windows-latest
            args: --exclude rovik-agentd
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # Each system's own shell (PowerShell on Windows), so the tests run in
    # the environment a developer's have.
    steps:
      # The runner's own toolchains this build doesn't use: room for the
      # test binaries.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # Windows' git writes CRLF line ends on checkout; the tests read the
      # files as they're committed.
      - name: Keep line ends as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      # The whole history: the evaluation's tasks on this repository start
      # from its earlier commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The app's own crate builds against WebKitGTK; fuse3 gives the
      # overlay tests a mount (they skip themselves without one, as they do
      # on macOS without macFUSE; Windows has no driver),
      # bubblewrap sandboxes every command the agent runs, as the app's
      # packages require, and passt's pasta gives a team server's commands
      # their user's private network (D20), which the core's tests make.
      - name: Install the system's packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libxdo-dev \
            fuse3 bubblewrap passt
      # Ubuntu 24.04's AppArmor keeps programs without a profile from making
      # user namespaces, so bubblewrap can't make its sandbox, and without
      # one the agent's commands are refused: the profile the app's packages
      # and the host installer add, by the same script, then proof that it
      # works for this user with the flags the app passes.
      - name: Let bubblewrap make its sandbox
        if: runner.os == 'Linux'
        run: |
          sudo sh src-tauri/crates/rovik-core/linux/bwrap-apparmor.sh
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
            --die-with-parent --cap-drop ALL -- /bin/true
          echo "bubblewrap makes a sandbox as $(id -un)"
      # Tests commit with the git command, as a developer's machine does.
      - name: Give git a name
        run: |
          git config --global user.name "Rovik CI"
          git config --global user.email "ci@rovik.invalid"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every test binary runs, so one run shows each that fails.
      - name: cargo test --workspace
        working-directory: src-tauri
        run: cargo test --workspace --no-fail-fast ${{ matrix.args }}
      # Where bubblewrap can't run, Landlock confines the commands: the
      # core's and the daemon's tests again, under it alone.
      - name: The core's tests under Landlock, bubblewrap's fallback
        if: runner.os == 'Linux' && !cancelled()
        working-directory: src-tauri
        env:
          ROVIK_CONFINE_COMMANDS: landlock
        run: cargo test --no-fail-fast -p rovik-core --lib
      - name: The daemon's tests under Landlock
        if: runner.os == 'Linux' && !cancelled()
        working-directory: src-tauri
        env:
          ROVIK_CONFINE_COMMANDS: landlock
        run: cargo test --no-fail-fast -p rovik-agentd
      - name: The daemon and its tests build
        if: runner.os == 'macOS' && !cancelled()
        working-directory: src-tauri
        run: cargo test -p rovik-agentd --no-run
      - name: The evaluation's dry run
        if: runner.os == 'Linux'
        run: node scripts/eval/eval.mjs dry-run

  frontend:
    name: Frontend tests, types and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:eval
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run format:check
