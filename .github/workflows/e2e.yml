# End-to-end run of the built app on a platform: builds it as it ships
# (its installers too), launches it and clicks and types through its main
# scenarios against a scripted fake model (scripts/e2e/run.mjs). The
# report, a screenshot per step and the logs are the run's artifact
# (e2e-<platform>), and the report is the job's summary.
#
# One platform at a time, as each costs (macOS minutes count tenfold in a
# private repository):
# - from the Actions tab: Run workflow, with the platform;
# - on a push whose head commit's message starts with "[e2e windows]",
#   "[e2e macos]" or "[e2e linux]" (only at the start: a message that
#   mentions them doesn't run anything). Without one, nothing runs.
#
# Windows and Linux are driven through WebDriver (tauri-driver, with
# msedgedriver or WebKitWebDriver). WKWebView has none, so on macOS the
# app is built a second time with an in-page bridge
# (scripts/e2e/bridge.tauri.conf.json) and driven through that; on Windows
# too when WebDriver can't start the app (its WebView2 doesn't open the
# debugging port msedgedriver asks for: scripts/e2e/webview2-probe.ps1).
# On Windows the app runs de-elevated (gsudo), as a user runs it.
name: E2E

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [windows, macos, linux]
        default: windows
  push:

permissions:
  contents: read

env:
  # A test build of the release: optimized, without the shipped build's
  # slow whole-program optimization.
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_INCREMENTAL: '0'

jobs:
  windows:
    name: Windows
    if: inputs.platform == 'windows' || startsWith(github.event.head_commit.message, '[e2e windows]')
    # Per job: a push that runs nothing doesn't cancel a run under way.
    concurrency:
      group: e2e-windows-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Kept when the scenarios fail too, as they do while being fixed:
          # the next run then doesn't build from nothing.
          cache-on-failure: true
          # The app's own crates too: they're most of the build. (A key of
          # its own: a cache restored by an exact key is never saved again.)
          cache-workspace-crates: true
          key: app-crates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo project's type check runs `npx tsc`: TypeScript on PATH, as
      # on a developer's machine (without it npx fetches an unrelated "tsc"
      # package, the check fails and the agent's changes don't land).
      - run: npm install -g typescript
      - name: Build the app and its installers
        run: npx tauri build
      - name: Install it (NSIS, silently)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Get-ChildItem src-tauri/target/release/bundle/msi, src-tauri/target/release/bundle/nsis |
            ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Rovik IDE\*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) {
            "Not found where the installer puts it; testing the build's own binary."
            $exe = Get-Item src-tauri/target/release/rovik-ide.exe
          }
          "Installed: $($exe.FullName)"
          "APP=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Get msedgedriver for the WebView2 runtime
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client"
          ) | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } | Select-Object -First 1
          "WebView2 runtime: $version"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          $driver = $null
          foreach ($base in 'https://msedgedriver.microsoft.com', 'https://msedgedriver.azureedge.net') {
            try {
              Invoke-WebRequest "$base/$version/edgedriver_win64.zip" -OutFile $zip
              Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
              $driver = "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe"
              break
            } catch {
              "${base}: $($_.Exception.Message)"
            }
          }
          if (-not $driver) {
            "Using the image's msedgedriver (it may not match the runtime)."
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          }
          & $driver --version
          "MSEDGEDRIVER=$driver" >> $env:GITHUB_ENV
      # gsudo: to run the app as a user would, not elevated as everything
      # on this runner is. An elevated WebView2 host (Runtime 150 on)
      # ignores the debugging port msedgedriver asks for in WEBVIEW2_*
      # variables, so WebDriver can't attach to it. (No virtual-files
      # driver: on Windows the agent works in WSL, which this runner, with
      # no nested virtualization, can't run.)
      - name: Install gsudo
        continue-on-error: true
        shell: pwsh
        run: |
          choco install gsudo -y --no-progress
          # Where choco puts it (a search of its folders took minutes).
          $gsudo = Get-Item 'C:\tools\gsudo\Current\gsudo.exe' -ErrorAction SilentlyContinue
          if (-not $gsudo) {
            $gsudo = Get-ChildItem 'C:\tools\gsudo', 'C:\Program Files\gsudo' -Recurse -Filter gsudo.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          "gsudo: $($gsudo.FullName)"
          $gsudo.DirectoryName >> $env:GITHUB_PATH
          # The run's output goes in the workspace: a user's to write in.
          icacls "$env:GITHUB_WORKSPACE" /grant "${env:USERNAME}:(OI)(CI)F" /Q
      # What WebDriver needs: the app up, and DevTools on the port asked for.
      # De-elevated commands go through a script of their own: the app's
      # path has a space, and no quoting has to survive gsudo.
      - name: Check the installed app's WebView2 can be debugged
        continue-on-error: true
        shell: pwsh
        run: |
          $script = "$env:GITHUB_WORKSPACE\as-user-probe.ps1"
          "& '$env:GITHUB_WORKSPACE\scripts\e2e\webview2-probe.ps1' -App '$env:APP'; exit `$LASTEXITCODE" |
            Set-Content $script
          gsudo --integrity Medium pwsh -NoProfile -File $script
      - name: Run the scenarios through WebDriver
        id: webdriver
        continue-on-error: true
        shell: pwsh
        run: |
          $command = "& '$((Get-Command node).Source)' '$env:GITHUB_WORKSPACE\scripts\e2e\run.mjs'" +
            " --app '$env:APP' --out '$env:GITHUB_WORKSPACE\e2e-out'" +
            " --native-driver '$env:MSEDGEDRIVER' --tauri-driver '$((Get-Command tauri-driver).Source)'"
          if (Get-Command gsudo -ErrorAction SilentlyContinue) {
            $script = "$env:GITHUB_WORKSPACE\as-user-run.ps1"
            "$command; exit `$LASTEXITCODE" | Set-Content $script
            gsudo --integrity Medium --chdir "$env:GITHUB_WORKSPACE" pwsh -NoProfile -File $script
          } else {
            'No gsudo: elevated, as the runner is.'
            Invoke-Expression $command
          }
          # 2: the app couldn't be started; the bridge's turn.
          if ($LASTEXITCODE -eq 2) { 'launch_failed=true' >> $env:GITHUB_OUTPUT }
          exit $LASTEXITCODE
      - name: Logs of that run
        if: steps.webdriver.outcome == 'failure'
        shell: bash
        run: |
          for f in e2e-out/run.log e2e-out/tauri-driver.log e2e-out/app.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -n 60 "$f"; }
          done
          echo "=== what the agent's tools returned"
          node scripts/e2e/model-log.mjs e2e-out/fake-model.jsonl | tail -n 40
          log="$(cygpath "$APPDATA")/rovik-ide/agent-log.jsonl"
          [ -f "$log" ] && { echo "=== agent-log.jsonl"; tail -n 15 "$log" | cut -c1-400; }
          true
      # WebDriver couldn't start the app: the scenarios through the in-page
      # bridge instead, as on macOS (a build of its own).
      - name: Build it with the end-to-end bridge
        if: steps.webdriver.outputs.launch_failed == 'true'
        run: npx tauri build --no-bundle --config scripts/e2e/bridge.tauri.conf.json
      - name: Run the scenarios through the bridge
        id: bridge
        if: steps.webdriver.outputs.launch_failed == 'true'
        continue-on-error: true
        run: node scripts/e2e/run.mjs --driver bridge --app src-tauri/target/release/rovik-ide.exe --out e2e-bridge
      - name: Logs of the bridge run
        if: steps.bridge.outcome == 'failure'
        shell: bash
        run: |
          for f in e2e-bridge/run.log e2e-bridge/app.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -n 60 "$f"; }
          done
          echo "=== what the agent's tools returned"
          node scripts/e2e/model-log.mjs e2e-bridge/fake-model.jsonl | tail -n 40
          log="$(cygpath "$APPDATA")/rovik-ide/agent-log.jsonl"
          [ -f "$log" ] && { echo "=== agent-log.jsonl"; tail -n 15 "$log" | cut -c1-400; }
          true
      - name: Report
        if: always()
        shell: bash
        run: |
          for r in e2e-out/report.md e2e-bridge/report.md; do
            [ -f "$r" ] && cat "$r" >> "$GITHUB_STEP_SUMMARY"
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: |
            e2e-out
            e2e-bridge
          if-no-files-found: ignore
      - name: Result
        if: always()
        shell: bash
        env:
          WEBDRIVER: ${{ steps.webdriver.outcome }}
          BRIDGE: ${{ steps.bridge.outcome }}
        run: |
          echo "WebDriver: $WEBDRIVER, bridge: ${BRIDGE:-not run}"
          # The bridge's result stands for a launch WebDriver couldn't make.
          if [ "$BRIDGE" = success ]; then exit 0; fi
          [ "$WEBDRIVER" = success ]

  macos:
    name: macOS
    if: inputs.platform == 'macos' || startsWith(github.event.head_commit.message, '[e2e macos]')
    # Per job: a push that runs nothing doesn't cancel a run under way.
    concurrency:
      group: e2e-macos-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    # Two builds of the app from nothing the first time.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Kept when the scenarios fail too, as they do while being fixed:
          # the next run then doesn't build from nothing.
          cache-on-failure: true
          # The app's own crates too: they're most of the build. (A key of
          # its own: a cache restored by an exact key is never saved again.)
          cache-workspace-crates: true
          key: app-crates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo project's type check runs `npx tsc`: TypeScript on PATH, as
      # on a developer's machine (without it npx fetches an unrelated "tsc"
      # package, the check fails and the agent's changes don't land).
      - run: npm install -g typescript
      - name: Build the app
        run: |
          npx tauri build --bundles app
          # The build as it ships, kept for the scenarios' other Rovik
          # windows: the disk image's build takes it out of the bundle
          # folder, the bridge build replaces it, and a page with the
          # bridge would take the run's commands.
          shipped=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/shipped"
          cp -R "$shipped" "$RUNNER_TEMP/shipped/"
          kept=$(ls -d "$RUNNER_TEMP"/shipped/*.app | head -1)
          echo "SECOND_APP=$kept/Contents/MacOS/$(ls "$kept/Contents/MacOS" | head -1)" >> "$GITHUB_ENV"
      - name: Package it as a disk image
        id: dmg
        continue-on-error: true
        timeout-minutes: 15
        run: |
          npx tauri build --bundles dmg
          ls -l src-tauri/target/release/bundle/dmg
      # The shipped app, as a user gets it: from the disk image, into
      # Applications, started. The scenarios then run on the bridge build.
      - name: Install it from the disk image and start it
        if: steps.dmg.outcome == 'success'
        continue-on-error: true
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          mkdir -p ~/Applications
          cp -R "$mnt"/*.app ~/Applications/
          hdiutil detach "$mnt"
          app=$(ls -d ~/Applications/*.app | head -1)
          exe="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          echo "Installed: $app"
          "$exe" > "$RUNNER_TEMP/installed-app.log" 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "It runs."
            kill "$pid"
          else
            echo "It exited:"
            cat "$RUNNER_TEMP/installed-app.log"
            exit 1
          fi
      - name: Build it again with the end-to-end bridge
        run: |
          npx tauri build --bundles app --config scripts/e2e/bridge.tauri.conf.json
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          exe=$(ls "$app/Contents/MacOS/" | head -1)
          echo "APP=$app/Contents/MacOS/$exe" >> "$GITHUB_ENV"
      - name: Run the scenarios
        run: node scripts/e2e/run.mjs --app "$APP" --out e2e-out --driver bridge --second-app "$SECOND_APP"
      - name: Logs of a failed run
        if: failure()
        run: |
          for f in e2e-out/run.log e2e-out/app.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -n 80 "$f"; }
          done
          echo "=== what the agent's tools returned"
          node scripts/e2e/model-log.mjs e2e-out/fake-model.jsonl | tail -n 40
          log="$HOME/Library/Application Support/rovik-ide/agent-log.jsonl"
          [ -f "$log" ] && { echo "=== agent-log.jsonl"; tail -n 15 "$log" | cut -c1-400; }
          true
      - name: Report
        if: always()
        run: cat e2e-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-macos
          path: e2e-out
          if-no-files-found: ignore

  linux:
    name: Linux
    if: inputs.platform == 'linux' || startsWith(github.event.head_commit.message, '[e2e linux]')
    # Per job: a push that runs nothing doesn't cancel a run under way.
    concurrency:
      group: e2e-linux-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # fuse3: the virtual files a chat across a workspace's folders works in
      # (the workspace steps), as the isolated chats' views are.
      - name: Install the system's packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            libsoup-3.0-dev libxdo-dev pkg-config \
            webkit2gtk-driver xvfb xdotool imagemagick dbus-x11 fuse3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Kept when the scenarios fail too, as they do while being fixed:
          # the next run then doesn't build from nothing.
          cache-on-failure: true
          # The app's own crates too: they're most of the build. (A key of
          # its own: a cache restored by an exact key is never saved again.)
          cache-workspace-crates: true
          key: app-crates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo project's type check runs `npx tsc`: TypeScript on PATH, as
      # on a developer's machine (without it npx fetches an unrelated "tsc"
      # package, the check fails and the agent's changes don't land).
      - run: npm install -g typescript
      - name: Build the app and its packages
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Run the scenarios
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
            node scripts/e2e/run.mjs --app src-tauri/target/release/rovik-ide --out e2e-out
      - name: Logs of a failed run
        if: failure()
        run: |
          for f in e2e-out/run.log e2e-out/tauri-driver.log e2e-out/app.log; do
            [ -f "$f" ] && { echo "=== $f"; tail -n 80 "$f"; }
          done
          echo "=== what the agent's tools returned"
          node scripts/e2e/model-log.mjs e2e-out/fake-model.jsonl | tail -n 40
          # The app's data is the run's own (run.mjs: its XDG folders).
          log="e2e-out/work/app/data/rovik-ide/agent-log.jsonl"
          [ -f "$log" ] && { echo "=== agent-log.jsonl"; tail -n 15 "$log" | cut -c1-400; }
          true
      - name: Report
        if: always()
        run: cat e2e-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: e2e-out
          if-no-files-found: ignore
