[package]
name = "rovik-protocol"
version.workspace = true
description = "What the app and the agent daemon send each other, and how Rovik's releases are signed"
edition.workspace = true

[features]
# A setting only the core's tests use (KindConfig::extra_tools).
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Releases' signatures (B02): minisign, as `tauri signer` makes them.
minisign-verify = "0.3.0"
base64 = "0.23.1"
# `Secret`'s memory is wiped when it's dropped.
zeroize = "1.9"
