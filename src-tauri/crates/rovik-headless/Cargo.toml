[package]
name = "rovik-headless"
version.workspace = true
description = "The agent without a window, for measuring it"
edition.workspace = true

[dependencies]
rovik-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
uuid.workspace = true

[dev-dependencies]
# The scripted model and temporary folders its tests run on.
rovik-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt"] }
