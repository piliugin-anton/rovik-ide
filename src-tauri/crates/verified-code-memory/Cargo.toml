[package]
name = "verified-code-memory"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Verified, evidence-gated long-term memory for coding agents"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
# The workspace's SQLite, so the app links one libsqlite3-sys with the core.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
