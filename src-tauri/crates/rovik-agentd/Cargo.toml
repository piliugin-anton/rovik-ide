[package]
name = "rovik-agentd"
version.workspace = true
description = "The agent on a server: a Core behind a Unix socket"
edition.workspace = true

[dependencies]
rovik-core.workspace = true
rovik-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "sync", "time"] }
futures-util.workspace = true
sha2.workspace = true
uuid.workspace = true
log.workspace = true
toml = "1.1"
# The HTTP server on the socket, and the WebSocket at /rpc.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
tokio-tungstenite.workspace = true
# Each project's bare repository, and the packs in and out of it (6.4).
git2.workspace = true
# A task's notice to the URL its computer named (autopilot-plan H06).
reqwest.workspace = true
# `status`: the chat database, read while the daemon runs (H08).
rusqlite.workspace = true
# A Node version's tarball (installer/toolchains.rs): the official .tar.gz,
# unpacked with these rather than with the system's tar and xz.
flate2 = "1"
tar = "0.4"
# What a project's file a service reads is now, for when its copy is made
# again (services/copy.rs).
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# A release key and files it signed (release::fixture).
rovik-protocol = { workspace = true, features = ["testing"] }
# The scripted model and temporary folders the daemon tests use.
rovik-core = { workspace = true, features = ["testing"] }
# The rows a killed daemon left, read from its database.
rusqlite.workspace = true
# The app's client, against the real daemon.
rovik-client.workspace = true
# An SSH server in the test for the client's tunnel (H02), with its keys.
russh = "0.64.1"
rand = "0.10"
tokio = { workspace = true, features = ["process"] }
hyper = { workspace = true, features = ["client", "http1"] }
http-body-util.workspace = true
