[package]
name = "rovik-agentd"
version.workspace = true
description = "The agent on a server: a Core behind a Unix socket"
edition.workspace = true

[dependencies]
rovik-core.workspace = true
rovik-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "sync", "time"] }
futures-util.workspace = true
sha2.workspace = true
uuid.workspace = true
log.workspace = true
toml = "1.1"
# The HTTP server on the socket, and the WebSocket at /rpc.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The scripted model and temporary folders the daemon tests use.
rovik-core = { workspace = true, features = ["testing"] }
# The rows a killed daemon left, read from its database.
rusqlite.workspace = true
# The app's client, against the real daemon.
rovik-client.workspace = true
tokio = { workspace = true, features = ["process"] }
hyper = { workspace = true, features = ["client", "http1"] }
http-body-util.workspace = true
