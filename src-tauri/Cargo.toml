[workspace]
# The app is the root package, so the Tauri CLI and tauri.conf.json stay
# where they are. The agent and what it uses are in crates/rovik-core,
# without Tauri, what the app and the daemon send each other is in
# crates/rovik-protocol, and the app's connection to a daemon in
# crates/rovik-client (docs/design/cloud-agent-dev-plan.md, D1).
members = [
    "crates/rovik-protocol",
    "crates/rovik-core",
    "crates/rovik-client",
    "crates/rovik-agentd",
    "crates/rovik-headless",
    "crates/eoka",
]
# A dependency kept here as published, but for its fixes (its FORK.md):
# built as one, not as a member, so its own tests and examples, and what
# they need, stay out of the workspace's.
exclude = ["crates/russh"]
resolver = "2"

[workspace.package]
version = "0.1.57"
edition = "2021"

# Dependencies the app and the core both use, at one version.
[workspace.dependencies]
rovik-protocol = { path = "crates/rovik-protocol" }
rovik-core = { path = "crates/rovik-core" }
rovik-client = { path = "crates/rovik-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SOCKS: a SOCKS5 proxy set in Settings → Network (rovik-core/src/net).
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "socks"] }
futures-util = "0.3.34"
ignore = "0.4.33"
walkdir = "2.5.0"
tokio = "1.53.1"
uuid = { version = "1.26.1", features = ["v4"] }
# Local operations only (merges, patches): the app adds https and ssh for
# the Git panel's fetch and push.
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
sha2 = "0.11.0"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
log = "0.4"
# HTTP and the WebSocket between the app and the daemon (4.1). The
# WebSocket is tungstenite's own, the version the core already has
# (through eoka).
hyper = "1.12"
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
libc = "0.2"
windows = "0.62"

# The agent's Chrome is driven over a pipe, not a DevTools port (D18,
# H08): eoka with a pipe transport, until a release of eoka has one.
# crates/eoka/FORK.md says what differs and how to drop the fork.
[patch.crates-io]
eoka = { path = "crates/eoka" }
# One SSH channel that isn't read mustn't hold up the others: russh with
# flow control by what's read, and a window counted once, until a release
# of russh has both. crates/russh/FORK.md says what differs and how to
# drop the fork.
russh = { path = "crates/russh" }

[package]
name = "rovik-ide"
version.workspace = true
description = "A minimal, low-memory IDE shell"
edition.workspace = true
default-run = "rovik-ide"

[lib]
name = "rovik_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rovik-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rovik-core.workspace = true
rovik-protocol.workspace = true
rovik-client.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
futures-util.workspace = true
ignore.workspace = true
notify = "8.2.0"
tokio = { workspace = true, features = ["time"] }
portable-pty = "0.9.0"
uuid.workspace = true
git2 = { workspace = true, features = ["https", "ssh"] }
sha2.workspace = true
log.workspace = true
regex.workspace = true
# Deleting moves to the system trash (Recycle Bin, macOS Trash, freedesktop.org trash).
trash = "5"
# rust-analyzer downloads: .gz (Linux, macOS) and .zip (Windows) releases.
flate2 = "1"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Intel Macs: the OpenSSL git2's HTTPS and SSH need, built from source. The
# Intel app is built on Apple silicon (release.yml), whose Homebrew OpenSSL
# is for the other CPU; openssl-sys finds none for Intel there.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
# The app's own updates (src/updates.rs). Its requests are built on the
# workspace's reqwest (`configure_client`), so it's kept to one minor
# version, the one whose reqwest that is; without its default features it
# also takes that reqwest's TLS, rather than adding ring and making it the
# TLS of every request in the process. Bundles of Tauri 1's kind (zipped)
# aren't made here.
tauri-plugin-updater = { version = "~2.14", default-features = false, features = ["system-proxy"] }

# The core's test support, and its short waits (a closed terminal's end,
# rovik_core::process::SessionTree), as the other crates' tests have them.
[dev-dependencies]
rovik-core = { workspace = true, features = ["testing"] }

# Dependencies optimized in dev builds (the tests', `tauri dev`): the tests
# spent half their CPU in them (hashing, Git, SQLite, tree-sitter, images)
# unoptimized, and they're built once, then cached. The workspace's own
# crates stay unoptimized, for quick rebuilds. Level 1 keeps nearly all of
# level 2's speed and builds faster.
[profile.dev.package."*"]
opt-level = 1

# Keep release builds small and light — matters for a "low memory" tool.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The daemon's: a panic in one run must not end the others (D15, K19).
[profile.release-daemon]
inherits = "release"
panic = "unwind"
