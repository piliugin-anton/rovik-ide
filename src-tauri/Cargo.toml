[package]
name = "tauri-ide"
version = "0.1.0"
description = "A minimal, low-memory IDE shell"
edition = "2021"

[lib]
name = "tauri_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
futures-util = "0.3.34"
bytes = "1.12.1"
ignore = "0.4.33"
notify = "8.2.0"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
walkdir = "2.5.0"
portable-pty = "0.9.0"
uuid = { version = "1.26.1", features = ["v4"] }
git2 = { version = "0.21.0", features = ["vendored-libgit2", "https", "ssh"] }
eoka = "0.5.14"
base64 = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
tauri-plugin-single-instance = "2.5.2"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
# Deleting moves to the system trash (Recycle Bin, macOS Trash, freedesktop.org trash).
trash = "5"
# rust-analyzer downloads: .gz (Linux, macOS) and .zip (Windows) releases.
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Keep release builds small and light — matters for a "low memory" tool.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
