[workspace]
# The app is the root package, so the Tauri CLI and tauri.conf.json stay
# where they are. The agent and what it uses are in crates/rovik-core,
# without Tauri (docs/design/cloud-agent-dev-plan.md, D1).
members = ["crates/rovik-core", "crates/rovik-headless"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Dependencies the app and the core both use, at one version.
[workspace.dependencies]
rovik-core = { path = "crates/rovik-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
futures-util = "0.3.34"
ignore = "0.4.33"
tokio = "1.53.1"
uuid = { version = "1.26.1", features = ["v4"] }
# Local operations only (merges, patches): the app adds https and ssh for
# the Git panel's fetch and push.
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
sha2 = "0.11.0"
regex = "1"
libc = "0.2"
windows = "0.62"

[package]
name = "rovik-ide"
version.workspace = true
description = "A minimal, low-memory IDE shell"
edition.workspace = true
default-run = "rovik-ide"

[lib]
name = "rovik_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rovik-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rovik-core.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
futures-util.workspace = true
ignore.workspace = true
notify = "8.2.0"
tokio = { workspace = true, features = ["time"] }
walkdir = "2.5.0"
portable-pty = "0.9.0"
uuid.workspace = true
git2 = { workspace = true, features = ["https", "ssh"] }
sha2.workspace = true
tauri-plugin-single-instance = "2.5.3"
regex.workspace = true
# Deleting moves to the system trash (Recycle Bin, macOS Trash, freedesktop.org trash).
trash = "5"
# rust-analyzer downloads: .gz (Linux, macOS) and .zip (Windows) releases.
flate2 = "1"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# winfsp.dll is delay-loaded (build.rs), so the app starts without WinFsp.
[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

# Keep release builds small and light — matters for a "low memory" tool.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The daemon's: a panic in one run must not end the others (D15, K19).
[profile.release-daemon]
inherits = "release"
panic = "unwind"
