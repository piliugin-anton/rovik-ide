[package]
name = "tauri-ide"
version = "0.1.0"
description = "A minimal, low-memory IDE shell"
edition = "2021"

[lib]
name = "tauri_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
futures-util = "0.3.34"
bytes = "1.12.1"
ignore = "0.4.33"
notify = "8.2.0"
tokio = "1.53.1"
walkdir = "2.5.0"
portable-pty = "0.9.0"
uuid = { version = "1.26.0", features = ["v4"] }

# Keep release builds small and light — matters for a "low memory" tool.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
